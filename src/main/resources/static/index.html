<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MolMap · 分子图结构变换规则审核</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="topbar">
  <div class="brand">MolMap <span class="tag">本地 · 结构变换审核</span></div>
  <nav class="tabs">
    <button data-tab="rules" class="tab active">规则</button>
    <button data-tab="cases" class="tab">案例 / 变换</button>
    <button data-tab="batch" class="tab">批量</button>
    <button data-tab="compose" class="tab">规则组合</button>
    <button data-tab="migrate" class="tab">版本迁移</button>
  </nav>
  <div class="actions">
    <button id="seedBtn" class="ghost">载入示例</button>
    <a class="ghost btnlink" href="/api/export/package.zip">导出包</a>
  </div>
</header>

<main>
  <!-- RULES -->
  <section id="tab-rules" class="panel active">
    <div class="grid2">
      <div class="card">
        <h2>定义规则</h2>
        <p class="hint">LHS 为匹配子图，RHS 为重写结果。共享原子 id 表示保留映射，LHS 独有=删除，RHS 独有=新增。</p>
        <label>规则 ID（可留空自动生成）</label>
        <input id="ruleId" placeholder="rule-ketoenol"/>
        <label>名称</label>
        <input id="ruleName" placeholder="酮-烯醇互变"/>
        <label>LHS（匹配子图 JSON）</label>
        <textarea id="lhsJson" rows="10"></textarea>
        <label>RHS（重写结果 JSON）</label>
        <textarea id="rhsJson" rows="10"></textarea>
        <button id="saveRule" class="primary">校验并提交新版本</button>
        <div id="ruleSaveMsg" class="msg"></div>
      </div>
      <div class="card">
        <h2>规则与版本</h2>
        <div id="ruleList" class="list"></div>
      </div>
    </div>
  </section>

  <!-- CASES -->
  <section id="tab-cases" class="panel">
    <div class="grid2">
      <div class="card">
        <h2>新建案例</h2>
        <label>规则</label>
        <select id="caseRule"></select>
        <label>搜索上限（原始映射）</label>
        <input id="matchLimit" type="number" value="1000" min="1"/>
        <label>反应前结构（原始证据，接收后不可改写）</label>
        <textarea id="caseInput" rows="12"></textarea>
        <button id="runCase" class="primary">本地枚举候选</button>
        <div id="runMsg" class="msg"></div>
      </div>
      <div class="card">
        <h2>案例列表</h2>
        <div id="caseList" class="list"></div>
      </div>
    </div>

    <div id="caseDetail" class="card hidden">
      <div class="detail-head">
        <h2 id="detailTitle"></h2>
        <div id="detailStatus" class="pill"></div>
      </div>
      <div id="conflictBox" class="conflict hidden"></div>
      <div class="stepbar">
        <button id="stepPrev" class="ghost">上一步</button>
        <span id="stepInfo"></span>
        <button id="stepNext" class="ghost">下一步</button>
        <label class="legend"><i class="sw kept"></i>保留</label>
        <label class="legend"><i class="sw del"></i>删除</label>
        <label class="legend"><i class="sw add"></i>新增</label>
        <label class="legend"><i class="sw stereo"></i>立体变化</label>
      </div>
      <div class="svgs">
        <figure><figcaption>输入（高亮匹配子图）</figcaption><div id="svgInput" class="svgbox"></div></figure>
        <figure><figcaption>产物候选（高亮重写结果）</figcaption><div id="svgProduct" class="svgbox"></div></figure>
      </div>
      <div id="candidateMeta" class="meta"></div>
      <div id="violationBox" class="violations"></div>
      <div class="lockrow">
        <input id="lockVersion" type="hidden"/>
        <button id="lockBtn" class="primary">锁定该映射并重新验证</button>
        <button id="unlockBtn" class="ghost">解除锁定</button>
      </div>
      <div id="certBox" class="cert"></div>
      <div id="unresolvedBox" class="unresolved"></div>
    </div>
  </section>

  <!-- BATCH -->
  <section id="tab-batch" class="panel">
    <div class="card">
      <h2>批量运行</h2>
      <p class="hint">同一输入可有多个产物候选；每个候选带稳定结构指纹。条目顺序不改变默认展示顺序。</p>
      <textarea id="batchJson" rows="16"></textarea>
      <button id="batchRun" class="primary">执行批量</button>
      <div id="batchSummary" class="msg"></div>
      <div id="batchResults" class="list"></div>
    </div>
  </section>

  <!-- COMPOSE -->
  <section id="tab-compose" class="panel">
    <div class="card">
      <h2>两规则顺序组合</h2>
      <p class="hint">第二条规则作用于第一条的产物。若第二条依赖第一条产生的临时编号（t# 新增原子），组合判定失败且不会留下半个结果。</p>
      <div class="grid3">
        <select id="compRule1"></select>
        <select id="compRule2"></select>
        <input id="compLimit" type="number" value="1000" title="搜索上限"/>
      </div>
      <label>输入结构</label>
      <textarea id="compInput" rows="10"></textarea>
      <button id="compRun" class="primary">组合并检测临时编号依赖</button>
      <div id="compMsg" class="msg"></div>
      <div id="compHistory" class="list"></div>
    </div>
  </section>

  <!-- MIGRATE -->
  <section id="tab-migrate" class="panel">
    <div class="card">
      <h2>迁移旧案例到新规则版本</h2>
      <p class="hint">规则新版本不会重写已确认案例。这里仅列出结论变化与映射漂移，供审阅。</p>
      <div class="grid3">
        <select id="migRule"></select>
        <select id="migVersion"></select>
        <button id="migRun" class="primary">生成迁移报告</button>
      </div>
      <div id="migResults"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
